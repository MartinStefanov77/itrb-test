    <!-- ===== CONTACT ===== -->
    <section id="contact" class="section contact">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-info reveal-left">
            <h2 class="section-heading" data-i18n="contact.heading"></h2>
            <p data-i18n="contact.desc"></p>
            <ul class="contact-details">
              <li>
                <svg viewBox="0 0 24 24">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span data-i18n="contact.address"></span>
              </li>
              <li>
                <svg viewBox="0 0 24 24">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <a href="mailto:info@itrb.org" data-i18n="contact.email">info@itrb.org</a>
              </li>
            </ul>

            <div class="contact-illustration">
              <img src="images/contact.svg" alt="" role="presentation" />
            </div>
          </div>

          <div class="contact-form-wrap reveal-right">
            <form class="contact-form" id="contactForm" novalidate>
              <!-- Honeypot — hidden from real users, bots fill it in -->
              <div class="form-honeypot" aria-hidden="true">
                <input type="text" name="website" tabindex="-1" autocomplete="off" />
              </div>

              <div class="form-group">
                <label for="name"><span data-i18n="contact.form.name"></span><span class="required-star">*</span></label>
                <input type="text" id="name" name="name" required placeholder="" />
                <span class="field-error" id="error-name"></span>
              </div>
              <div class="form-group">
                <label for="email"><span data-i18n="contact.form.email"></span><span class="required-star">*</span></label>
                <input type="email" id="email" name="email" required placeholder="" />
                <span class="field-error" id="error-email"></span>
              </div>
              <div class="form-group">
                <label for="subject"><span data-i18n="contact.form.subject"></span><span class="required-star">*</span></label>
                <input type="text" id="subject" name="subject" required placeholder="" />
                <span class="field-error" id="error-subject"></span>
              </div>
              <div class="form-group">
                <label for="message"><span data-i18n="contact.form.message"></span><span class="required-star">*</span></label>
                <textarea id="message" name="message" rows="5" required placeholder=""></textarea>
                <span class="field-error" id="error-message"></span>
              </div>

              <!-- Math captcha -->
              <div class="form-group form-group--captcha" id="captchaGroup">
                <label for="captchaAnswer">
                  <span data-i18n="contact.form.captcha"></span>
                  <strong id="captchaQuestion" class="captcha-question">…</strong>
                  <span class="captcha-equals">= ?</span>
                  <span class="required-star">*</span>
                </label>
                <input type="number" id="captchaAnswer" name="captcha_answer" min="0" max="18" required placeholder="" />
                <input type="hidden" id="captchaToken" name="captcha_token" />
                <span class="field-error" id="error-captcha"></span>
              </div>

              <div class="form-group form-group--checkbox">
                <label class="checkbox-label">
                  <input type="checkbox" id="agree" name="agree" />
                  <span class="checkbox-text"><span data-i18n="contact.form.agree"></span><span class="required-star">*</span></span>
                </label>
                <span class="field-error" id="error-agree"></span>
              </div>
              <button type="submit" class="btn btn-primary btn-full" data-i18n="contact.form.submit"></button>
              <div class="form-status" id="formStatus"></div>
            </form>
          </div>
        </div>
      </div>
    </section>
