<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITRB Content Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #191e29;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Styles */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #00e5c1 url(../images/bckgr_login.svg) no-repeat;
            display: flex;
            background-position: top center;
            background-size: 100% auto;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .login-box {
            background: #001f3f;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #fff;
        }

        .login-box p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .login-box .form-group {
            position: relative;
            margin-bottom: 15px;
        }

        .login-box .form-group svg {
            position: absolute;
            top: 12px;
            left: 12px;
            stroke: #64748b;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            background: #0f172a;
            color: white;
        }

        .login-box .form-group input::placeholder {
            color: #64748b;
        }

        .login-box img {
            margin: 0 auto 20px;
            display: block;
            max-width: 180px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
        }

        .login-box button:hover {
            background: #2563eb;
        }

        .login-box button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .error-message {
            color: #ef4444;
            margin-top: 12px;
            font-size: 14px;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .page-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #007bff;
            color: white;
        }

        .section-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .section-btn {
            padding: 6px 12px;
            background: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .section-btn.active {
            background: #007bff;
            color: white;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .lang-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .lang-tab {
            padding: 8px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
        }

        .lang-tab.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            margin-bottom: -11px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .repeater-item {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .add-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        .save-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .save-status.saving {
            background: #ffc107;
        }

        .save-status.error {
            background: #dc3545;
        }

        button {
            cursor: pointer;
        }

        .main-content {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .local-mode-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        #mainContent h1 {
            color: #fff;
        }

        #mainContent h2 {
            margin: 0 0 20px;
            color: #fff;
        }

        #mainContent h1 img {
            max-width: 120px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <img src="images/logo-white.svg" alt="ITRB Ltd." />
            <h2>ITRB Content Manager</h2>
            <p>Enter your credentials to access</p>
            <div class="form-group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="off">
            </div>
            <div class="form-group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="loginPassword" placeholder="Password"
                    onkeypress="if(event.key==='Enter') login()">
            </div>
            <button id="loginBtn" onclick="login()">Login</button>
            <div id="loginError" class="error-message"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content">
        <div class="container">
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            <h1><img src="images/logo-white.svg" alt="ITRB Ltd." /></h1>
            <h2>ITRB Content Manager</h2>

            <div class="page-tabs" id="pageTabs"></div>
            <div class="section-selector" id="sectionSelector"></div>

            <div class="form-card" id="formContainer">Loading...</div>

            <div class="save-status" id="saveStatus">● Auto-save</div>
        </div>
    </div>

    <script>
        // ========================
        // Detect environment
        // ========================
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        // API endpoints
        const API = {
            login: isLocalhost ? null : 'login.php',
            save: isLocalhost ? null : 'save-content.php',
            load: isLocalhost ? 'data/content.json' : 'save-content.php'
        };

        console.log('Running in', isLocalhost ? 'LOCAL mode (Download JSON only)' : 'SERVER mode (with PHP)');

        // ========================
        // Authentication (only on server)
        // ========================
        let isLoggedIn = false;

        async function checkAuth() {
            if (isLocalhost) {
                // Local mode - no login required
                isLoggedIn = true;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                load();
                return;
            }

            try {
                const res = await fetch(API.login, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (data.logged_in) {
                    isLoggedIn = true;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    load();
                } else {
                    isLoggedIn = false;
                    document.getElementById('loginOverlay').style.display = 'flex';
                    document.getElementById('mainContent').style.display = 'none';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'none';
            }
        }

        async function login() {
            if (isLocalhost) {
                // Local mode - just show content
                isLoggedIn = true;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                load();
                return;
            }

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            if (!email || !password) {
                errorDiv.textContent = 'Please enter email and password';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';

            try {
                const res = await fetch(API.login, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    isLoggedIn = true;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    load();
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password';
                    document.getElementById('loginPassword').value = '';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
            }
        }

        async function logout() {
            if (isLocalhost) {
                // Local mode - just hide content and show login
                isLoggedIn = false;
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('loginOverlay').style.display = 'flex';
                return;
            }

            try {
                await fetch(API.login, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            isLoggedIn = false;
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').textContent = '';
        }

        // ========================
        // Data
        // ========================
        let content = null;
        let currentPage = 'home';
        let currentLang = 'en';
        let currentSection = null;
        let saveTimeout = null;

        // Страници и секции
        const pages = {
            home: {
                name: '🏠 Home Page',
                sections: ['hero', 'whatWeDo', 'services', 'ourEdge', 'approach', 'contactCta']
            },
            services: {
                name: '🛠️ Services Page',
                sections: ['servicesPage']
            },
            whoWeAre: {
                name: '👥 Who We Are',
                sections: ['whoWeAre', 'team']
            },
            careers: {
                name: '💼 Careers Page',
                sections: ['careers']
            },
            contact: {
                name: '📞 Contact Page',
                sections: ['contact']
            }
        };

        // ========================
        // Load JSON
        // ========================
        async function load() {
            try {
                const url = API.load + '?v=' + Date.now();
                const res = await fetch(url);
                if (res.ok) {
                    content = await res.json();
                    console.log('Loaded:', content);
                } else {
                    throw new Error('No file');
                }
            } catch (e) {
                content = { en: {}, bg: {} };
            }
            currentSection = pages[currentPage].sections[0];
            render();
        }

        // ========================
        // Save JSON (auto-save)
        // ========================
        async function save() {
            if (!content) return;

            const status = document.getElementById('saveStatus');

            if (isLocalhost) {
                // Local mode - download JSON
                downloadJSON();
                status.innerHTML = '✓ Downloaded';
                status.className = 'save-status';
                setTimeout(() => {
                    if (document.getElementById('saveStatus')) {
                        document.getElementById('saveStatus').innerHTML = '● Download JSON';
                    }
                }, 2000);
                return;
            }

            // Server mode - save via PHP
            status.innerHTML = '● Saving...';
            status.className = 'save-status saving';

            try {
                const res = await fetch(API.save, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(content)
                });
                const result = await res.json();
                if (result.success) {
                    status.innerHTML = '✓ Saved';
                    status.className = 'save-status';
                    setTimeout(() => {
                        if (document.getElementById('saveStatus')) {
                            document.getElementById('saveStatus').innerHTML = '● Auto-save';
                        }
                    }, 2000);
                } else {
                    throw new Error('Save failed');
                }
            } catch (e) {
                status.innerHTML = '✗ Error - downloading';
                status.className = 'save-status error';
                downloadJSON(); // fallback
                setTimeout(() => {
                    if (document.getElementById('saveStatus')) {
                        document.getElementById('saveStatus').innerHTML = isLocalhost ? '● Download JSON' : '● Auto-save';
                        document.getElementById('saveStatus').className = 'save-status';
                    }
                }, 3000);
            }
        }

        function triggerSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => save(), 1500);
            const status = document.getElementById('saveStatus');
            if (!isLocalhost) {
                status.innerHTML = '● Saving...';
                status.className = 'save-status saving';
            }
        }

        // ========================
        // Helper
        // ========================
        function getSectionData(section, lang) {
            if (!content[lang]) return null;
            return content[lang][section];
        }

        // ========================
        // Download JSON (backup)
        // ========================
        function downloadJSON() {
            const dataStr = JSON.stringify(content, null, 2);
            const link = document.createElement('a');
            link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            link.download = 'content.json';
            link.click();
        }

        // ========================
        // Render
        // ========================
        function render() {
            renderPageTabs();
            renderSectionSelector();
            renderForm();
        }

        function renderPageTabs() {
            const container = document.getElementById('pageTabs');
            container.innerHTML = Object.keys(pages).map(key => `
                <button class="page-btn ${currentPage === key ? 'active' : ''}" onclick="switchPage('${key}')">
                    ${pages[key].name}
                </button>
            `).join('');
        }

        function renderSectionSelector() {
            const sections = pages[currentPage].sections;
            const container = document.getElementById('sectionSelector');
            container.innerHTML = sections.map(section => `
                <button class="section-btn ${currentSection === section ? 'active' : ''}" onclick="switchSection('${section}')">
                    ${section}
                </button>
            `).join('');
        }

        function renderForm() {
            let html = `
                <div class="lang-tabs">
                    <button class="lang-tab ${currentLang === 'en' ? 'active' : ''}" onclick="switchLang('en')">🇬🇧 ENGLISH</button>
                    <button class="lang-tab ${currentLang === 'bg' ? 'active' : ''}" onclick="switchLang('bg')">🇧🇬 БЪЛГАРСКИ</button>
                </div>
            `;

            const langData = getSectionData(currentSection, currentLang);
            if (langData) {
                html += renderFields(langData, currentSection);
            } else {
                html += '<p>No data for this section. Start editing!</p>';
            }

            document.getElementById('formContainer').innerHTML = html;
        }

        function renderFields(data, section) {
            // Hero section
            if (section === 'hero') {
                return `
                    <div class="form-group"><label>title1</label><textarea onchange="updateField('${section}', '${currentLang}', 'title1', this.value)">${escape(data.title1 || '')}</textarea></div>
                    <div class="form-group"><label>title2</label><textarea onchange="updateField('${section}', '${currentLang}', 'title2', this.value)">${escape(data.title2 || '')}</textarea></div>
                    <div class="form-group"><label>subtitle</label><textarea onchange="updateField('${section}', '${currentLang}', 'subtitle', this.value)">${escape(data.subtitle || '')}</textarea></div>
                    <div class="form-group"><label>subtitle2</label><textarea onchange="updateField('${section}', '${currentLang}', 'subtitle2', this.value)">${escape(data.subtitle2 || '')}</textarea></div>
                    <div class="form-group"><label>cta</label><input type="text" value="${escape(data.cta || '')}" onchange="updateField('${section}', '${currentLang}', 'cta', this.value)"></div>
                `;
            }

            // What We Do
            if (section === 'whatWeDo') {
                return `
                    <div class="form-group"><label>tag</label><input type="text" value="${escape(data.tag || '')}" onchange="updateField('${section}', '${currentLang}', 'tag', this.value)"></div>
                    <div class="form-group"><label>heading</label><input type="text" value="${escape(data.heading || '')}" onchange="updateField('${section}', '${currentLang}', 'heading', this.value)"></div>
                    <div class="form-group"><label>p1</label><textarea onchange="updateField('${section}', '${currentLang}', 'p1', this.value)">${escape(data.p1 || '')}</textarea></div>
                    <div class="form-group"><label>p2</label><textarea onchange="updateField('${section}', '${currentLang}', 'p2', this.value)">${escape(data.p2 || '')}</textarea></div>
                `;
            }

            // Services (home page)
            if (section === 'services') {
                let itemsHtml = '';
                if (data.items && data.items.length) {
                    itemsHtml = data.items.map((item, i) => `
                        <div class="repeater-item">
                            <button class="remove-btn" onclick="removeServiceItem(${i})">✕</button>
                            <div class="form-group"><label>name</label><input type="text" value="${escape(item.name)}" onchange="updateServiceItem(${i}, 'name', this.value)"></div>
                            <div class="form-group"><label>desc</label><textarea onchange="updateServiceItem(${i}, 'desc', this.value)">${escape(item.desc)}</textarea></div>
                        </div>
                    `).join('');
                }
                return `
                    <div class="form-group"><label>tag</label><input type="text" value="${escape(data.tag || '')}" onchange="updateField('${section}', '${currentLang}', 'tag', this.value)"></div>
                    <div class="form-group"><label>heading</label><input type="text" value="${escape(data.heading || '')}" onchange="updateField('${section}', '${currentLang}', 'heading', this.value)"></div>
                    ${itemsHtml}
                    <button class="add-btn" onclick="addServiceItem()">+ Add Service</button>
                    <div class="form-group"><label>cta</label><input type="text" value="${escape(data.cta || '')}" onchange="updateField('${section}', '${currentLang}', 'cta', this.value)"></div>
                `;
            }

            // Our Edge
            if (section === 'ourEdge') {
                let itemsHtml = '';
                if (data.items && data.items.length) {
                    itemsHtml = data.items.map((item, i) => `
                        <div class="repeater-item">
                            <button class="remove-btn" onclick="removeEdgeItem(${i})">✕</button>
                            <div class="form-group"><label>title</label><input type="text" value="${escape(item.title)}" onchange="updateEdgeItem(${i}, 'title', this.value)"></div>
                            <div class="form-group"><label>desc</label><textarea onchange="updateEdgeItem(${i}, 'desc', this.value)">${escape(item.desc)}</textarea></div>
                        </div>
                    `).join('');
                }
                return `
                    <div class="form-group"><label>tag</label><input type="text" value="${escape(data.tag || '')}" onchange="updateField('${section}', '${currentLang}', 'tag', this.value)"></div>
                    <div class="form-group"><label>heading</label><input type="text" value="${escape(data.heading || '')}" onchange="updateField('${section}', '${currentLang}', 'heading', this.value)"></div>
                    ${itemsHtml}
                    <button class="add-btn" onclick="addEdgeItem()">+ Add Edge Point</button>
                `;
            }

            // Approach
            if (section === 'approach') {
                return `
                    <div class="form-group"><label>tag</label><input type="text" value="${escape(data.tag || '')}" onchange="updateField('${section}', '${currentLang}', 'tag', this.value)"></div>
                    <div class="form-group"><label>heading</label><input type="text" value="${escape(data.heading || '')}" onchange="updateField('${section}', '${currentLang}', 'heading', this.value)"></div>
                    <div class="form-group"><label>intro</label><textarea onchange="updateField('${section}', '${currentLang}', 'intro', this.value)">${escape(data.intro || '')}</textarea></div>
                    <div class="form-group"><label>lifecycleLabel</label><input type="text" value="${escape(data.lifecycleLabel || '')}" onchange="updateField('${section}', '${currentLang}', 'lifecycleLabel', this.value)"></div>
                    <div class="form-group"><label>steps</label><textarea onchange="updateField('${section}', '${currentLang}', 'steps', this.value)">${escape(data.steps || '')}</textarea></div>
                    <div class="form-group"><label>para</label><textarea onchange="updateField('${section}', '${currentLang}', 'para', this.value)">${escape(data.para || '')}</textarea></div>
                    <div class="form-group"><label>envs</label><textarea onchange="updateField('${section}', '${currentLang}', 'envs', this.value)">${escape(data.envs || '')}</textarea></div>
                    <div class="form-group"><label>cta</label><input type="text" value="${escape(data.cta || '')}" onchange="updateField('${section}', '${currentLang}', 'cta', this.value)"></div>
                `;
            }

            // Contact CTA
            if (section === 'contactCta') {
                return `
                    <div class="form-group"><label>heading</label><input type="text" value="${escape(data.heading || '')}" onchange="updateField('${section}', '${currentLang}', 'heading', this.value)"></div>

        function updateField(section, lang, field, value) {
            if (!content[lang][section]) content[lang][section] = {};
            content[lang][section][field] = value;
            triggerSave();
        }

        function updateNestedField(section, lang, path, value) {
            const parts = path.split('.');
            let obj = content[lang][section];
            for (let i = 0; i < parts.length - 1; i++) {
                if (!obj[parts[i]]) obj[parts[i]] = {};
                obj = obj[parts[i]];
            }
            obj[parts[parts.length - 1]] = value;
            triggerSave();
        }

            if (!content[currentLang].careers.positions[posIndex].niceToHave) {
                content[currentLang].careers.positions[posIndex].niceToHave = [];
            }
            content[currentLang].careers.positions[posIndex].niceToHave.push("New nice to have");
            renderForm();
            triggerSave();
        }

        function removeCareerNiceToHave(posIndex, reqIndex) {
            content[currentLang].careers.positions[posIndex].niceToHave.splice(reqIndex, 1);
            renderForm();
            triggerSave();
        }

        function updateCareerNiceToHave(posIndex, reqIndex, value) {
            content[currentLang].careers.positions[posIndex].niceToHave[reqIndex] = value;
            triggerSave();
        }
