<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- ===== NAVIGATION ===== -->
    <a class="skip-link" href="#main-content"></a>
    <header>
        <nav id="navbar" aria-label="Main navigation">
            <div class="nav-inner">
                <a href="index.html" class="nav-logo" data-nav="home">
                    <img src="images/logo-white.svg" alt="ITRB" class="logo-img" width="171" height="38" />
                </a>

                <ul class="nav-links" id="navLinks">
                    <li><a href="index1.html" class="active" data-nav="home" data-i18n="nav.home"></a></li>
                    <li><a href="services1.html" data-nav="services" data-i18n="nav.services"></a></li>
                    <li><a href="who-we-are1.html" data-nav="who-we-are" data-i18n="nav.whoWeAre"></a></li>
                    <li><a href="careers.html" data-nav="careers" data-i18n="nav.careers">Careers</a></li>
                    <li><a href="contact1.html" data-nav="contact" data-i18n="nav.contact"></a></li>
                </ul>

                <div class="nav-actions">
                    <div class="lang-switcher">
                        <button class="lang-btn active" data-lang="en" aria-label="Switch to English">EN</button>
                        <span class="lang-sep">/</span>
                        <button class="lang-btn" data-lang="bg" aria-label="Превключи на Български">BG</button>
                    </div>
                    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content">

        <!-- ===== HERO ===== -->
        <section id="home" class="hero">
            <div class="hero-video-wrap" aria-hidden="true">
                <video id="heroVideo" autoplay muted loop playsinline>
                    <source src="videos/hero-video.mp4" type="video/mp4" />
                </video>
                <div class="hero-overlay"></div>
            </div>

            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="hero-title-line" data-i18n="hero.title1"></span>
                    <span class="hero-title-line hero-title-accent" data-i18n="hero.title2"></span>
                </h1>
                <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
                <p class="hero-subtitle hero-subtitle--small" data-i18n="hero.subtitle2"></p>
                <div class="hero-actions">
                    <a href="contact.html" class="btn btn-primary" data-i18n="hero.cta"></a>
                </div>
            </div>

            <div class="hero-scroll">
                <div class="scroll-dot"></div>
                <div class="scroll-line-wrap">
                    <div class="scroll-line"></div>
                </div>
            </div>
        </section>

        <!-- ===== WHAT WE DO ===== -->
        <section id="what-we-do" class="section bg-light deco">
            <div class="container">
                <div class="split">
                    <div class="split-text reveal-left">
                        <h2 class="section-heading" data-i18n="whatWeDo.heading"></h2>
                        <p data-i18n="whatWeDo.p1"></p>
                        <p data-i18n="whatWeDo.p2"></p>
                    </div>
                    <div class="split-media reveal-right">
                        <div class="media-frame">
                            <img src="images/about-photo.svg" alt="ITRB" />
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== SERVICES (summary) ===== -->
        <section id="services-overview" class="section bg-dark">
            <div class="container">
                <div class="section-header reveal-up">
                    <h2 class="section-heading" data-i18n="services.heading"></h2>
                </div>
                <ul class="home-svc-cards reveal-up">
                    <li>
                        <span class="edge-title" data-i18n="services.items.0.name"></span>
                        <span class="edge-desc" data-i18n="services.items.0.desc"></span>

                    <li>
                        <span class="edge-title" data-i18n="services.items.1.name"></span>
                        <span class="edge-desc" data-i18n="services.items.1.desc"></span>
                    </li>
                    <li>
                        <span class="edge-title" data-i18n="services.items.2.name"></span>

                        <span class="edge-title" data-i18n="services.items.4.name"></span>
                        <span class="edge-desc" data-i18n="services.items.4.desc"></span>

                    <li>
                        <span class="edge-title" data-i18n="services.items.5.name"></span>

                    </li>
                    <li>
                        <span class="edge-title" data-i18n="services.items.6.name"></span>

                    <li>
                        <span class="edge-title" data-i18n="services.items.7.name"></span>
                        <span class="edge-desc" data-i18n="services.items.7.desc"></span>
                    </li>

                <p class="section-cta reveal-up">
                    <a href="services.html" class="btn btn-outline" data-i18n="services.cta"></a>
                </p>
            </div>
        </section>

        <!-- ===== OUR EDGE ===== -->
        <section id="our-edge" class="section bg-light">
            <div class="container">
                <div class="section-header reveal-up">
                    <h2 class="section-heading" data-i18n="ourEdge.heading"></h2>
                </div>
                <ul class="home-edge-list reveal-up">
                    <li>
                        <span class="edge-title" data-i18n="ourEdge.items.0.title"></span>
                        <span class="edge-desc" data-i18n="ourEdge.items.0.desc"></span>

                    <li>
                        <span class="edge-title" data-i18n="ourEdge.items.1.title"></span>

            <div class="container">
                <div class="split">
                    <div class="split-media reveal-left">
                        <div class="media-frame">
                            <img src="images/service-3.svg" alt="Our Approach" />

                    </div>
                    <div class="split-text reveal-right">
                        <h2 class="section-heading" data-i18n="approach.heading"></h2>
                        <p data-i18n="approach.intro"></p>
                        <p data-i18n="approach.para"></p>
                        <p data-i18n="approach.envs"></p>
                        <a href="who-we-are1.html" class="btn btn-outline"
                            aria-label="About ITRB — our approach and positioning" data-i18n="approach.cta"></a>
                    </div>

                <div class="contact-cta-inner reveal-up">

                    <p data-i18n="contactCta.desc"></p>
